<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion365 — Galaxy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#101b3d,#05060b 45%,#030409);color:#eef1ff;font-family:system-ui,sans-serif}
header{text-align:center;padding:24px;border-bottom:1px solid #20243a}h1{margin:0;letter-spacing:5px}.sub{opacity:.6;letter-spacing:3px;font-size:12px;margin-top:6px}
main{max-width:1120px;margin:auto;padding:28px 18px}.galaxy{text-align:center;padding-bottom:35px}
.orbwrap{position:relative;width:300px;height:300px;max-width:78vw;max-height:78vw;margin:auto;display:grid;place-items:center;cursor:pointer}
.orbit{position:absolute;inset:0;border:1px solid #f4c76b88;border-radius:50%;animation:spin 18s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:white;box-shadow:0 0 18px #7fa2ff,0 0 28px #f4c76b}.orbit:before{top:3px;left:50%}.orbit:after{bottom:18px;right:8%}
.orb{width:190px;height:190px;border-radius:50%;position:relative;background:radial-gradient(circle at 30% 25%,white 0,#a9c0ff 7%,#527cff 23%,#38247e 50%,#100d27 75%,#05060b);border:1px solid #ffffffaa;box-shadow:0 0 28px #5d7fff,0 0 75px #484fff88;animation:pulse 4s ease-in-out infinite}
.orb:before{content:"M";position:absolute;inset:0;display:grid;place-items:center;color:#f4c76b;font-size:76px;font-weight:800;text-shadow:0 0 14px #f4c76b}
.orb:after{content:"13";position:absolute;right:38px;bottom:47px;color:#fff1bd;font-size:22px;font-weight:700}
@keyframes pulse{50%{transform:translateY(-7px) scale(1.045)}}@keyframes spin{to{transform:rotate(360deg)}}
.orblabel{display:inline-block;margin:8px 0 8px;padding:7px 14px;border:1px solid #f4c76b66;border-radius:999px;color:#f9dda0;font-size:12px;letter-spacing:2px}
.galaxy p{color:#aeb7d7;max-width:680px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:22px;border:1px solid #28304f;border-radius:18px;background:#0b0f1df5}.tag{opacity:.6;font-size:11px;letter-spacing:2px}.card h2{margin:6px 0 8px}.card p{color:#aeb7d7;min-height:48px;line-height:1.45}
button{width:100%;padding:12px;margin-top:10px;border:1px solid #4650a0;border-radius:12px;background:#111631;color:white;font-size:15px}
footer{text-align:center;padding:28px;opacity:.45;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.orb{width:170px;height:170px}.orb:before{font-size:68px}}
</style>
</head>
