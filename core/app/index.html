<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion365.faith — Architect</title><style>body{margin:0;background:#07111f;color:#edf5ff;font:15px system-ui;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px 18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#10213a;border:1px solid #294565;border-radius:16px;padding:20px}h1{margin:4px 0 24px}h2{margin:0 0 6px}p{color:#9db1c9}label{display:block;font-size:12px;margin:13px 0 5px;color:#bdd0e6}input,textarea,select{width:100%;box-sizing:border-box;background:#081525;color:#fff;border:1px solid #294565;border-radius:9px;padding:10px;font:inherit}textarea{min-height:80px}.row{display:flex;gap:8px}.row input{flex:1}button{border:0;border-radius:9px;padding:10px 13px;background:#63d7ff;color:#06101d;font-weight:700;cursor:pointer}button.alt{background:#1c3552;color:#dff0ff;border:1px solid #365576}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.msg{min-height:22px;margin-top:10px}.ok{color:#66e3a4}.bad{color:#ff8196}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.stat{background:#0a192b;border:1px solid #294565;border-radius:10px;padding:9px 12px}.stat b{display:block;font-size:20px}.stat small{color:#9db1c9}.item{padding:14px;margin:9px 0;background:#0b1a2c;border:1px solid #294565;border-radius:12px}.item h3{margin:0 0 4px}.item p{margin:0;font-size:13px}.tag{display:inline-block;margin-top:8px;margin-right:8px;padding:3px 8px;border-radius:999px;background:#1d3858;color:#bfeaff;font-size:11px}.danger{float:right;background:#3b1e2b;color:#ffb5c1}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><div><small style="color:#63d7ff;letter-spacing:.15em">MOTION365.FAITH</small><h1>Architect — create your destinations</h1></div><div class="grid"><section class="card"><h2>Creation code</h2><p>Generate a one-time code, then use it to create a Node, Portal, Ecosystem, or World.</p><label>Type</label><select id="type"><option>Node</option><option>Portal</option><option>Ecosystem</option><option>World</option></select><label>Name</label><input id="name" maxlength="80" placeholder="Aurora Node"><label>Description</label><textarea id="desc" maxlength="500" placeholder="What belongs here?"></textarea><label>Code</label><div class="row"><input id="code" placeholder="M365-ABC123"><button id="gen">Generate</button></div><div id="msg" class="msg"></div><div class="actions"><button id="create">Create destination</button><button class="alt" id="clear">Clear</button></div></section><section class="card"><div class="stats"><div class="stat"><b id="total">0</b><small>Total</small></div><div class="stat"><b id="node">0</b><small>Nodes</small></div><div class="stat"><b id="portal">0</b><small>Portals</small></div><div class="stat"><b id="ecosystem">0</b><small>Ecosystems</small></div><div class="stat"><b id="world">0</b><small>Worlds</small></div></div><div id="items"></div></section></div></main><script>const $=x=>document.getElementById(x),msg=(x,ok=false)=>{$('msg').textContent=x;$('msg').className='msg '+(ok?'ok':'bad')};async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let a=await api('/api/destinations');$('total').textContent=a.length;['Node','Portal','Ecosystem','World'].forEach(t=>$ (t.toLowerCase()).textContent=a.filter(x=>x.type===t).length);$('items').innerHTML=a.length?a.map(x=>`<article class="item"><button class="danger" data-del="${x.id}">Delete</button><h3>${esc(x.name)}</h3><p>${esc(x.description||'No description')}</p><span class="tag">${x.type}</span><span class="tag">${x.code}</span></article>`).join(''):'<p>No destinations yet.</p>'}$('gen').onclick=async()=>{try{$('code').value=(await api('/api/codes',{method:'POST'})).code;msg('One-time code generated.',true)}catch(e){msg(e.message)}};$('create').onclick=async()=>{try{let d={type:$('type').value,name:$('name').value.trim(),description:$('desc').value.trim(),code:$('code').value.trim().toUpperCase()};await api('/api/destinations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});msg('Destination created.',true);$('name').value=$('desc').value=$('code').value='';load()}catch(e){msg(e.message)}};$('clear').onclick=()=>{$('name').value=$('desc').value=$('code').value='';$('msg').textContent=''};$('items').onclick=e=>{let id=e.target.dataset.del;if(id)api('/api/destinations/'+id,{method:'DELETE'}).then(load)};load()</script></body></html>
